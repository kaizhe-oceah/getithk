dependency_overrides:
  # camera_android: 0.10.6

  # Upstream 7.0.7296 (latest on pub.dev) extends the now-final IconData class,
  # which fails to compile on Flutter 3.44+. See third_party/*/pubspec.yaml.
  material_design_icons_flutter:
    path: third_party/material_design_icons_flutter

  # Upstream 0.0.14 hardcodes the nav bar's shadow; the vendored copy adds a
  # showShadow flag. See third_party/*/pubspec.yaml.
  liquid_glass_bottom_nav:
    path: third_party/liquid_glass_bottom_nav

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: true
  ios: true
  # iOS icons can't have alpha. app_icon.png pre-flattened onto black — the
  # tool's own remove_alpha_ios leaves a green fringe on the disc edge.
  image_path_ios: "assets/launcher/app_icon_ios.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  # Android 8+ adaptive icon: the logo on black, inset to match app_icon.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/app_logo.png"
  adaptive_icon_foreground_inset: 17
  web:
    generate: true
    image_path: "assets/images/app_icon.png"

# Native launch screen, same colour as the Flutter splash (AppColors.darkBackgroundColor)
# so there is no white flash before the intro animation starts.
flutter_native_splash:
  color: "#0E0E0E"
  android_12:
    color: "#0E0E0E"
    # Android 12+ always shows an icon on the system splash; a transparent one
    # keeps it plain black until the Flutter splash takes over.
    image: "assets/launcher/transparent.png"
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/cfg/
    - assets/translations/
    - assets/images/
    - assets/lotties/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
    - family: CustomSvgIcon
      fonts:
        - asset: assets/fonts/CustomSvgIcon.ttf

scripts:
  # refresh
  refresh: clear && flutter clean && flutter pub get
  refresh-ios: cd ios && pod deintegrate && rm -fr Pods && rm Pod-file && rm -Rf Podfile.lock && rm -Rf .symlinks && rm -Rf Flutter/Flutter.framework && rm -Rf Flutter/Flutter.podspec && pod cache clean --all && pod install --repo-update
  refresh-git: git fetch --prune && git branch --v | grep "\[gone\]" | awk '{print $1}' | xargs git branch -D

  # build
  build-web: clear && flutter clean && flutter pub get && flutter build web --web-renderer html --release
  build-ipa: clear && flutter clean && flutter pub get && flutter build ios --release
  build-appbundle: clear && flutter clean && flutter pub get && flutter build appbundle --release
  build-apk: clear && flutter clean && flutter pub get && flutter build apk --release

  # others
  fix: dart fix --apply
  pub-upgrade: flutter pub upgrade --major-versions
  import-sort: flutter pub run import_sorter:main
  create-launcher-icon: dart run flutter_launcher_icons:main
  # Keys land in android/app/, where the signingConfigs in build.gradle expect
  # them. Both overwrite any existing keystore — a lost release key means no
  # more updates to a published app, so back the file up somewhere safe.
  create-release-keystore: keytool -genkey -v -keystore android/app/release_key.keystore -storepass atasmobile -alias atasmobile -keypass atasmobile -keyalg RSA -keysize 2048 -validity 10000
  create-debug-keystore: keytool -genkey -v -keystore android/app/debug_key.keystore -storepass atasmobile -alias atasmobile -keypass atasmobile -keyalg RSA -keysize 2048 -validity 10000
